
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Recipes</title>

    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/vasu.js" defer></script>
    <script src="/js/wanting.js" defer></script>
</head>

<body>
    <main>
        <!-- Homepage Header -->
        <header class="homepage-header">
            <div>
                <h1>Recipe Manager</h1>
                <p>Your personal recipe collection</p>
            </div>
        <!-- Modified this to add the delete button -->
            <div class="header-actions">
                <button type="button" id="createRecipeButton">
                    + Create Recipe
                </button>

                <button type="button" id="deleteRecipeButton">
                    🗑 Delete Recipe
                </button>
            </div>
        </header>

        <!-- READ - WAN TING -->
        <section id="recipeHomepage" aria-labelledby="viewRecipeHeading">
            <h2 id="viewRecipeHeading">All Recipes</h2>

            <!-- SEARCH AND FILTER - WAN TING -->
            <div class="recipe-controls">
                <input
                    type="search"
                    id="searchRecipe"
                    placeholder="Search recipes by name..."
                    aria-label="Search recipes by name"
                >

                <select id="filterCuisine" aria-label="Filter recipes by cuisine">
                    <option value="All">All Cuisines</option>
                    <option value="Indian">Indian</option>
                    <option value="Chinese">Chinese</option>
                    <option value="Japanese">Japanese</option>
                    <option value="Korean">Korean</option>
                    <option value="Italian">Italian</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <p id="readRecipeMessage" role="status"></p>

            <div id="recipeList"></div>
        </section>
    </main>
</body>

</html>
